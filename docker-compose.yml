version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: AssignmentManagerDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=AssignmentManagerDb;Username=postgres;Password=yourpassword
      - Jwt__Key=ThisIsASecretKeyForJwtTokenGeneration12345!
      - Jwt__Issuer=AssignmentManager
      - Jwt__Audience=AssignmentManagerUsers
    ports:
      - "7100:7100"
    restart: on-failure

volumes:
  pgdata: